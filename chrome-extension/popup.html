<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #fafafa;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #333;
    }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .status.connected {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .status.disconnected {
      background: #ffebee;
      color: #c62828;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background: #1976d2;
      color: white;
    }
    .btn-primary:hover {
      background: #1565c0;
    }
    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }
    .btn-secondary:hover {
      background: #d0d0d0;
    }
    .feedback {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-top: 4px;
      min-height: 18px;
    }
    .hint {
      font-size: 11px;
      color: #999;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h2>ReadLater</h2>
  <div id="status" class="status">Checking server...</div>

  <button id="save-page" class="btn-primary">Save This Page as PDF</button>
  <button id="save-email" class="btn-secondary">Save Email Content</button>

  <div id="feedback" class="feedback"></div>

  <div class="hint">
    Tip: You can also right-click any page or link.
  </div>

  <script src="popup.js"></script>
</body>
</html>
